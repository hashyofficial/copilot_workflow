name: Cancel superseded Build 7 packaging attempt
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build7-cancel-obsolete-once.yml
permissions:
  actions: write
  contents: read
jobs:
  cancel-old-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel only outdated Build 7 run 40250241678
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/actions/runs/40250241678/cancel" || {
            echo "Older run may have already completed or been cancelled"
          }
