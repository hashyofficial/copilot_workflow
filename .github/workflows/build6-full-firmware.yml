name: MIUI Build 6 - reviewed native libraries and complete fastboot firmware

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build6-full-firmware.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD6_STOCK_ARCHIVE: ${{ github.workspace }}/.build6-work/stock/yunluo_global_images_V14.0.4.0.TLYMIXM_20231207.0000.00_13.0_global_4003dcb1a4.tgz
      BUILD6_PRIVATE: ${{ github.workspace }}/.build6-work/private-super-NOT-UPLOADED
      BUILD6_REPORTS: ${{ github.workspace }}/.build6-work/report
      ROM_NAME: yunluo_MIUI14_Global_Build6_108Folders_3OrphanJNI_AVBDisabled_Fastboot.zip
      ROM_RELEASE: yunluo-miui14-build6-deep-debloat-experimental
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate all 108 deletions and three pinned JNI libraries
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build5_gallery_targets.py scripts/build6_cleanup.py scripts/pack_super_build6.py scripts/repack_build6_fastboot.py scripts/build6_lib_audit.py scripts/build6_native_references.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from build5_gallery_targets import targets_from_build4,GALLERY_LOCATION
          from build6_cleanup import APPROVED_PINNED_NATIVE
          removed,_,protected,_=targets_from_build4()
          assert len(removed)==108 and GALLERY_LOCATION in removed and len(protected)==3
          assert len(APPROVED_PINNED_NATIVE)==3
          print("Build6: 108 whole app directories and 3 separately audited JNI library candidates")
          PY
          df -h "$RUNNER_TEMP"
      - name: Install pinned Android image tools and EROFS utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl ca-certificates erofs-utils attr util-linux file python3 unzip python3-pyflakes
          python3 scripts/inventory.py --install-tools
      - name: Check Python undefined names before any multi-gigabyte firmware build
        run: |
          set -euo pipefail
          pyflakes scripts/repack_build6_fastboot.py scripts/pack_super_build6.py scripts/build6_cleanup.py \
            > "$RUNNER_TEMP/build6-pyflakes.txt" 2>&1 || true
          if grep -E 'undefined name' "$RUNNER_TEMP/build6-pyflakes.txt"; then
            echo "Undefined Python variable detected; refusing to waste runner time" >&2
            exit 1
          fi
          echo "No undefined Python names in Build 6 scripts"
      - name: Prove EROFS excludes individual library files, without removing parent directory
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/source/lib64" "$TMP/mount"
          echo remove > "$TMP/source/lib64/libOrphanJNI.so"
          echo preserve > "$TMP/source/lib64/libCore.so"
          mkfs.erofs -T 1700000000 --exclude-path=lib64/libOrphanJNI.so "$TMP/probe.erofs" "$TMP/source"
          fsck.erofs "$TMP/probe.erofs"
          sudo mount -t erofs -o ro,loop "$TMP/probe.erofs" "$TMP/mount"
          test ! -e "$TMP/mount/lib64/libOrphanJNI.so"
          test "$(cat "$TMP/mount/lib64/libCore.so")" = preserve
          sudo umount "$TMP/mount"
          echo "Verified individual .so exclusion leaves shared lib64 directory intact"
      - name: Download pinned original MIUI 14 Global fastboot ROM and verify MD5
        run: |
          mkdir -p "$BUILD6_REPORTS" "$(dirname "$BUILD6_STOCK_ARCHIVE")"
          python3 scripts/download.py --output "$BUILD6_STOCK_ARCHIVE" --report "$BUILD6_REPORTS/stock-download.json"
          echo "4003dcb1a4db404e2768801fdb429c4a  $BUILD6_STOCK_ARCHIVE" | md5sum -c -
      - name: Rebuild private super with inherited 108 folder removals plus only approved leftover files
        run: |
          sudo --preserve-env=BUILD6_STOCK_ARCHIVE,BUILD6_PRIVATE,BUILD6_REPORTS,GITHUB_WORKSPACE,ANDROID_HOME \
            python3 scripts/pack_super_build6.py
          sudo chown -R "$(id -u):$(id -g)" "$BUILD6_PRIVATE" "$BUILD6_REPORTS"
          python3 - <<'PY'
          import json,os,pathlib
          from collections import Counter
          doc=json.loads((pathlib.Path(os.environ["BUILD6_PRIVATE"])/"manifest.json").read_text())
          assert doc["model"]=="yunluo" and doc["build"]=="6-experimental"
          assert doc["total_directories_removed"]==108 and doc["additional_apks_installed"]==0
          assert doc["lp_metadata_preserved"] and doc["other_regions_unchanged"]
          assert doc["cell_broadcast_service_apex_modified"] is False
          files=[f for p in doc["build6_cleanup_by_partition"] for f in p["selected"] if f["kind"]=="native_library"]
          assert len(files)==3 and len(set(x["path"] for x in files))==3
          assert doc["build6_extra_files_removed"]>=3
          print("Verified 108 folder removals, all 3 pinned JNI files, all retained paths, and LP metadata")
          PY
      - name: Replace only super and vbmeta in complete original fastboot firmware and recalculate CRC lists
        run: |
          mkdir -p "$RUNNER_TEMP/packaged"
          python3 scripts/repack_build6_fastboot.py \
            --archive "$BUILD6_STOCK_ARCHIVE" \
            --artifact "$BUILD6_PRIVATE" \
            --zip "$RUNNER_TEMP/packaged/$ROM_NAME" \
            --report "$BUILD6_REPORTS"
      - name: Verify complete firmware ZIP and divide into exactly two resumable Release assets
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packaged"
          sha256sum "$ROM_NAME" > ZIP_SHA256.txt
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"packaged"
          f=root/os.environ["ROM_NAME"]
          report=json.loads((pathlib.Path(os.environ["BUILD6_REPORTS"])/"VERIFICATION.json").read_text())
          assert f.stat().st_size==report["firmware_zip_bytes"]
          assert hashlib.file_digest(f.open("rb"),"sha256").hexdigest()==report["firmware_zip_sha256"]
          with zipfile.ZipFile(f) as z:
              assert z.testzip() is None
              keys=z.namelist()
              for suffix in ("/images/super.img","/images/vbmeta.img","/images/crclist.txt",
                             "/images/sparsecrclist.txt","/flash_all.sh"):
                  assert sum(n.endswith(suffix) for n in keys)==1,suffix
          size=f.stat().st_size
          half=(size+1)//2
          assert half<2_000_000_000, "Half ZIP exceeds GitHub Release asset 2GB cap"
          stem=f.name
          names=[stem+".001",stem+".002"]
          with f.open("rb") as source:
              for index,name in enumerate(names):
                  out=root/name
                  remaining=half if index==0 else size-half
                  with out.open("wb") as sink:
                      while remaining:
                          chunk=source.read(min(8*1024*1024,remaining))
                          if not chunk:raise RuntimeError("Unexpected ZIP truncation")
                          sink.write(chunk);remaining-=len(chunk)
          if sum((root/name).stat().st_size for name in names)!=size:
              raise RuntimeError("Split ZIP size mismatch")
          digest=hashlib.sha256()
          parts=[]
          for name in names:
              ph=hashlib.sha256()
              with (root/name).open("rb") as inp:
                  while chunk:=inp.read(8*1024*1024):
                      digest.update(chunk);ph.update(chunk)
              parts.append({"name":name,"bytes":(root/name).stat().st_size,"sha256":ph.hexdigest()})
          if digest.hexdigest()!=report["firmware_zip_sha256"]:
              raise RuntimeError("Split ZIP reassembly digest mismatch")
          (root/"PARTS_SHA256.txt").write_text("".join(x["sha256"]+"  "+x["name"]+"\n" for x in parts))
          (root/"DOWNLOAD_MANIFEST.json").write_text(json.dumps({
              "device":"yunluo","build":6,"zip_name":f.name,
              "zip_sha256":report["firmware_zip_sha256"],"zip_bytes":size,
              "parts":parts,"app_folders_removed":108,"extra_native_jni_libraries_removed":3
          },indent=2)+"\n")
          print("Two parts and complete ZIP verified: SHA256",report["firmware_zip_sha256"])
          PY
          rm "$ROM_NAME"
      - name: Publish Build 6 experimental Release with just two firmware halves and checksums
        run: |
          set -euo pipefail
          if gh release view "$ROM_RELEASE" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "Release tag already exists. Refusing to overwrite existing artifacts." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/build6-notes.md" <<'EOF'
          ## Redmi Pad yunluo — Build 6 Experimental (MIUI 14 Global, Android 13)
          
          **Base:** Official Xiaomi V14.0.4.0.TLYMIXM.
          **App debloat:** All 108 complete folders from the boot-confirmed Build 5,
          including Gallery and all libraries/odex/vdex inside those folders.
          **Additional standalone JNI cleanup:** libMiraVision_jni.so (32 and 64 bit)
          and libprintspooler_jni.so (64 bit), each pinned to source SHA256 and
          absent from 3,233 retained-file and 152,951 ZIP-entry reference checks.
          **Safety:** Bluetooth, telephony, MIUI monitor and voice-command JNI files
          with retained dependencies are preserved. Other unmatched/shared libs stay.
          No new APK or root manager is injected. Original stock boot.img is retained.
          
          Complete fastboot firmware with Build 6 super.img, AVB-disabled vbmeta.img
          (flags=3) and corrected crclist.txt/sparsecrclist.txt. Original flash_all.sh,
          partition XML/scatter, all other firmware images remain stock.
          
          **Download BOTH ZIP halves (.001 and .002)** into the same directory,
          then on Linux:
          
              cat yunluo_MIUI14_Global_Build6_108Folders_3OrphanJNI_AVBDisabled_Fastboot.zip.001 \
                  yunluo_MIUI14_Global_Build6_108Folders_3OrphanJNI_AVBDisabled_Fastboot.zip.002 \
                  > yunluo_MIUI14_Global_Build6_108Folders_3OrphanJNI_AVBDisabled_Fastboot.zip
              sha256sum -c ZIP_SHA256.txt
          
          These are GitHub Release assets, not expiring Actions build artifacts.
          Always verify before flashing. Experimental Build 6 is **not device-boot-tested**.
          Retain your known-working V1.0/Build5 firmware.
          **Unlocked bootloader only. NEVER use flash_all_lock.sh.**
          The original flash_all.sh overwrites userdata; back up all important data.
          EOF
          cd "$RUNNER_TEMP/packaged"
          gh release create "$ROM_RELEASE" "$ROM_NAME".001 "$ROM_NAME".002 \
            ZIP_SHA256.txt PARTS_SHA256.txt DOWNLOAD_MANIFEST.json \
            -R "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Redmi Pad MIUI 14 Build 6 - Deep Debloat (Experimental)" \
            --notes-file "$RUNNER_TEMP/build6-notes.md" \
            --latest=false --prerelease
      - name: Upload small Build 6 review and offline verification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yunluo-build6-cleanup-and-offline-verification
          path: ${{ github.workspace }}/.build6-work/report/
          retention-days: 30
          if-no-files-found: warn
